<!DOCTYPE html>
<!-- RummiCard — © 2026 Richard Boulais & Claude -->
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Le jeu ne charge rien d'ailleurs : la règle peut donc être stricte sans
     rien coûter. Elle n'autorise de script que les cinq fichiers du jeu, et
     surtout aucun script en ligne — ni balise injectée, ni attribut onerror.
     C'est la deuxième barrière derrière l'échappement des noms venus d'un
     journal.
     « 'unsafe-inline' » ne vaut que pour les styles : la taille des cartes et
     la couleur du tapis s'écrivent dans l'attribut style.
     Vérifié dans une vraie WKWebView chargée en file://, comme l'app macOS :
     « 'self' » y désigne bien les fichiers du bundle, contrairement à ce que
     laisse craindre l'origine opaque d'un document local. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self';
  manifest-src 'self';
  worker-src 'self';
  base-uri 'none';
  form-action 'none'">
<!-- « maximum-scale=1 » est le dernier levier contre le zoom au double-tap,
     et il se paie : s'il est honoré, le zoom à deux doigts tombe avec lui —
     on prive donc d'agrandir qui en aurait besoin. Essayé à contrecœur, après
     que tout le reste a échoué sur l'iPhone : « touch-action » sur chaque
     élément, en « none » comme en « manipulation », puis trois garde-fous en
     JavaScript. Le journal de mise au point a fini par dire pourquoi — pas une
     seule ligne « tap » : les événements tactiles n'arrivent jamais jusqu'à la
     page, et aucun code ne pouvait donc écarter le geste.
     « user-scalable=no » n'est pas ajouté : Safari l'ignore depuis iOS 10 et
     il n'apporterait rien de plus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RummiCard</title>
<meta name="description" content="Un rami de combinaisons joué avec 2 jeux de 52 cartes.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RummiCard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ Accueil ============ -->
<div id="menu">
  <div class="logo">
    <div class="mini">
      <div class="card s1"><div class="corner"><span class="rank">7</span><span class="cs">&hearts;</span></div><div class="suit">&hearts;</div></div>
      <div class="card s2"><div class="corner"><span class="rank">8</span><span class="cs">&diams;</span></div><div class="suit">&diams;</div></div>
      <div class="card s3"><div class="corner"><span class="rank">9</span><span class="cs">&clubs;</span></div><div class="suit">&clubs;</div></div>
    </div>
    Rummi<span style="color:#f0b429">Card</span>
  </div>
  <p class="tag" data-i18n="accueil.desc"></p>
  <h2 data-i18n="accueil.joueurs"></h2>
  <div class="choices" id="choices"></div>
  <!-- Reprendre ou redonner, jamais les deux : ce sont deux façons de ne pas
       commencer une partie neuve, et elles se placent donc avant le bouton
       qui, lui, en commence une. buildMenu n'en montre qu'une. -->
  <button class="btn hidden" id="resume"></button>
  <button class="btn hidden" id="replay"></button>
  <button class="cta" id="start" data-i18n="accueil.commencer"></button>
  <button class="linkbtn hidden" id="thanks"></button>
  <div style="display:flex;gap:18px">
    <button class="linkbtn" id="rules-link" data-i18n="accueil.voirRegles"></button>
    <button class="linkbtn" id="menu-options" data-i18n="accueil.options"></button>
  </div>
  <div class="langs" id="langs"></div>
  <div class="foot"><span id="version">Version de développement</span><span id="copyright"></span></div>
</div>

<!-- ============ Jeu ============ -->
<div id="game" class="hidden">
  <header>
    <div class="brand">Rummi<span>Card</span></div>
    <div class="pill"><span data-i18n="hud.pioche"></span>&nbsp;<b id="deckcount">0</b></div>
    <div class="pill hidden" id="roundpill">Manche&nbsp;<b>1/3</b></div>
    <div id="oppmini"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="options" data-i18n-title="tip.options">&#9881;</button>
    <button class="iconbtn" id="sound" data-i18n-title="tip.son">&#128266;</button>
    <button class="iconbtn" id="help" data-i18n-title="tip.regles">?</button>
    <button class="iconbtn" id="restart" data-i18n-title="tip.quitter">&#10005;</button>
  </header>

  <div id="opponents"></div>

  <div id="boardwrap"><div id="board"></div></div>

  <div id="rackwrap">
    <div class="racklabel" id="racklabel"></div>
    <div id="rack"></div>
  </div>

  <div id="bar">
    <!-- Le symbole « retour » d'Unicode, celui des claviers : c'est Entree qui
         mene au suivant. Avec le retour arriere d'« Annuler », les deux
         premiers boutons portent chacun sa touche. -->
    <button class="btn go" id="commit">&#9166;<span class="lbl" data-i18n="btn.suivant"></span></button>
    <!-- Le meme emplacement que « Au suivant » : jamais les deux a la fois.
         Soit on dit au suivant, soit on pioche, et c'est la seule facon de
         finir son tour. -->
    <button class="btn" id="draw">&#127183;<span class="lbl" data-i18n="btn.piocher"></span></button>
    <!-- Le caractere de la touche retour arriere, qui est justement le
         raccourci d'« Annuler » : le pictogramme enseigne la touche. Le ↩
         d'avant etait celui de la touche Retour, attribuee a « Au suivant ». -->
    <button class="btn" id="undo" data-i18n-title="tip.annuler">&#9003;<span class="lbl" data-i18n="btn.annuler"></span></button>
    <!-- Le meme emplacement qu'« Annuler » : jamais les deux a la fois. Tant
         qu'il reste un geste a defaire, c'est « Annuler », pas a pas. Quand il
         n'y en a plus, « Refaire » prend sa place — et demande confirmation,
         parce qu'il efface tout un tour d'un coup. -->
    <button class="btn" id="rewind"
            data-i18n-title="tip.refaire">&#8634;<span class="lbl" data-i18n="btn.refaire"></span></button>
    <button class="btn magic" id="auto">&#10024;<span class="lbl" data-i18n="btn.magique"></span></button>
    <button class="btn" id="sort"
            data-i18n-title="tip.trier">&#8645;<span class="lbl" data-i18n="btn.trier"></span></button>
    <button class="btn hint" id="hints"
            data-i18n-title="tip.indices">&#128161;<span class="lbl" data-i18n="btn.indices"></span></button>
    <div id="msg"></div>
  </div>
</div>

<div id="rotate"><div><b id="rotate-t"></b><span id="rotate-p"></span></div></div>
<div id="toast"></div>
<div id="overlay" class="hidden"></div>

<script src="i18n.js"></script>
<!-- Le moteur avant le solveur : c'est lui qui dit ce que vaut une carte,
     et le solveur l'interroge pour choisir le coup le plus payant. -->
<script src="engine.js"></script>
<script src="solver.js"></script>
<script src="ai.js"></script>
<script src="ui.js"></script>
</body>
</html>
