# Publie le jeu sur GitHub Pages à chaque poussée sur main.
# Pages ne sait servir que la racine ou /docs : ce workflow envoie donc
# directement le dossier Resources/web, sans rien compiler.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Resources/web
      - id: pages
        uses: actions/deploy-pages@v4
